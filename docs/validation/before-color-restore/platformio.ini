[platformio]
default_envs = pixelpad_s3_rtos

[env]
platform = espressif32@6.13.0
board = 4d_systems_esp32s3_gen4_r8n16
framework = arduino
platform_packages = framework-arduinoespressif32@3.20017.0
board_build.partitions = partitions.csv
board_build.filesystem = littlefs
build_unflags = -DARDUINO_USB_CDC_ON_BOOT=1
monitor_speed = 115200
upload_speed = 460800
lib_deps =
    bblanchon/ArduinoJson@7.4.3
    mathertel/OneButton@2.6.2
    madhephaestus/ESP32Encoder@0.12.0
    ayushsharma82/ElegantOTA@3.1.7
    ESP32Async/ESPAsyncWebServer@3.11.1
    ESP32Async/AsyncTCP@3.4.10
    mrfaptastic/ESP32 HUB75 LED MATRIX PANEL DMA Display@3.0.15
    adafruit/Adafruit GFX Library@1.12.6
    adafruit/Adafruit BusIO@1.17.4
    fastled/FastLED@3.10.3
build_flags =
    -Iinclude
    -DELEGANTOTA_USE_ASYNC_WEBSERVER=1
    -DARDUINO_USB_MSC_ON_BOOT=0
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DALIYUN_PRODUCT_KEY=\"demo_product_key\"
    -DFW_VERSION_MAJOR=3
    -DFW_VERSION_MINOR=2
    -DFW_VERSION_PATCH=4
    -DPIXELPAD_RTOS=1

; S3 uses a 160 MHz source. Explicit dividers avoid the driver's misleading
; 8M -> 10M / 20M -> 22.86M mappings. Internal SRAM holds the DMA buffers.
[display_fast]
build_flags =
    -DS3_LCD_DIV_NUM=10
    -DPIXEL_COLOR_DEPTH_BITS=4
    -DPIXELPAD_SCAN_MIN_HZ=240
    -DPIXELPAD_DOUBLE_BUFFER=1

[env:pixelpad_s3_rtos]
build_flags =
    ${env.build_flags}
    ${display_fast.build_flags}

; Optional A/B build: removes the always-on Wi-Fi AP for BLE-focused use.
[env:pixelpad_s3_ble_only]
extends = env:pixelpad_s3_rtos
build_flags =
    ${env:pixelpad_s3_rtos.build_flags}
    -DPIXELPAD_WIFI_OTA=0

; Same 4-bit / double-buffer path at the original board's actual 10 MHz clock.
[env:pixelpad_s3_refresh_safe]
build_flags =
    ${env.build_flags}
    -DS3_LCD_DIV_NUM=16
    -DPIXEL_COLOR_DEPTH_BITS=4
    -DPIXELPAD_SCAN_MIN_HZ=240
    -DPIXELPAD_DOUBLE_BUFFER=1

; Original scan/colour settings for comparison, with corrected clock reporting.
[env:pixelpad_s3_color]
build_flags =
    ${env.build_flags}
    -DS3_LCD_DIV_NUM=16
    -DPIXEL_COLOR_DEPTH_BITS=8
    -DPIXELPAD_SCAN_MIN_HZ=60
    -DPIXELPAD_DOUBLE_BUFFER=0
